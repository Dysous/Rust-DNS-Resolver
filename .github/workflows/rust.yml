name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose

  deploy:
    # Only deploy on pushes to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build  # Don't deploy if build/tests fail
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build release binary
      run: cargo build --release --verbose

    - name: Open SSH for deploy
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Add runner IP to security group
      run: |
        RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
        aws ec2 authorize-security-group-ingress \
          --group-id ${{ secrets.SG_ID }} \
          --protocol tcp --port 22 \
          --cidr ${RUNNER_IP}/32

    - name: Copy binary to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: target/release/Project5
        target: /home/ubuntu/dns-server/

    - name: Restart DNS server on EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: sudo systemctl restart dns-server

    - name: Remove runner IP from security group
      if: always()   # runs even if deploy fails
      run: |
        RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
        aws ec2 revoke-security-group-ingress \
          --group-id ${{ secrets.SG_ID }} \
          --protocol tcp --port 22 \
          --cidr ${RUNNER_IP}/32